appId: com.infinum.sentinel.sample.debug
name: Network Proxy - rules and the proxy switch survive an app restart
tags:
  - regression
properties:
  junitClassname: e2e.networkproxy
---
- runFlow: ../../subflows/launch_clean.yaml
- runFlow: ../../subflows/open_network_proxy.yaml
- runFlow: ../../subflows/enable_proxy.yaml
- runFlow:
    file: ../../subflows/add_mock_rule.yaml
    env:
      RULE_PATH: "/persist/*"
      RULE_STATUS: "418"
      RULE_BODY: '{"qa":"kept"}'
# Restart without clearing state
- stopApp
- launchApp:
    clearState: false
# Same cold start wait as launch_clean
- extendedWaitUntil:
    visible: "Network Proxy"
    timeout: 60000
- runFlow: ../../subflows/open_network_proxy.yaml
- assertVisible:
    id: "enabledSwitch"
    childOf:
      id: "toolbar"
    checked: true
- assertVisible:
    id: "path"
    text: "/persist/*"
- assertVisible:
    id: "statusCode"
    text: "418"
# The editor loads what was saved
- tapOn:
    id: "path"
    text: "/persist/*"
- assertVisible:
    id: "pathInput"
    text: "/persist/*"
- assertVisible:
    id: "statusCodeInput"
    text: "418"
- assertVisible:
    id: "bodyPreview"
    text: ".*kept.*"
